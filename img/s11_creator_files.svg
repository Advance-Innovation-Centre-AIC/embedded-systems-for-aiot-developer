<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'Noto Sans Thai','Noto Sans',Segoe UI,sans-serif">
  <rect width="1200" height="460" rx="14" fill="#0d1b2e"/>
  <g font-size="24" fill="#e6edf3" font-family="ui-monospace,Menlo,Consolas,monospace">
