    <text x="30"  y="104" fill="#ffd479">├─ HelpClassification.improj</text>
    <text x="30"  y="156">└─ Models/<tspan fill="#9fb3c8" font-family="'Noto Sans Thai',sans-serif" font-size="19">   (บางโปรเจกต์ไม่มีชั้นนี้ — ไม่เป็นไร ร้านไม่สนโครงโฟลเดอร์)</tspan></text>
    <text x="60"  y="204">└─ &lt;ชื่อโมเดล&gt;/</text>
    <text x="90"  y="252" fill="#ffd479">├─ &lt;ชื่อโมเดล&gt;.h5</text>
