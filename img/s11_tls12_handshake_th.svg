<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="tcpArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#1e88e5"/></marker>
    <marker id="tlsArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#43a047"/></marker>
    <marker id="appArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#212121"/></marker>
  </defs>
  <text x="262" y="30" text-anchor="middle" font-size="23" font-weight="700" fill="#37474f">บอร์ด (Client)</text>
  <text x="600" y="30" text-anchor="middle" font-size="23" font-weight="700" fill="#37474f">แพลตฟอร์ม (Server)</text>
  <rect x="222" y="42" width="80" height="46" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="262" y="72" text-anchor="middle" font-size="19" fill="#0d47a1">Eva Kit</text>
  <rect x="555" y="42" width="90" height="46" rx="6" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-size="19" fill="#4527a0">EMQX</text>
  <line x1="262" y1="88" x2="262" y2="452" stroke="#b0bec5" stroke-width="3"/>
  <line x1="600" y1="88" x2="600" y2="452" stroke="#b0bec5" stroke-width="3"/>
  <line x1="14" y1="110" x2="840" y2="110" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="14" y1="152" x2="840" y2="152" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="14" y1="194" x2="840" y2="194" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="14" y1="236" x2="840" y2="236" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="14" y1="278" x2="840" y2="278" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="14" y1="320" x2="840" y2="320" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="14" y1="362" x2="840" y2="362" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="14" y1="404" x2="840" y2="404" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="14" y1="446" x2="840" y2="446" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="610" y="104" font-size="18" fill="#546e7a">0 ms</text>
  <text x="252" y="146" text-anchor="end" font-size="18" fill="#546e7a">34 ms</text>
  <text x="610" y="188" font-size="18" fill="#546e7a">68 ms</text>
  <text x="252" y="230" text-anchor="end" font-size="18" fill="#546e7a">102 ms</text>
  <text x="610" y="272" font-size="18" fill="#546e7a">136 ms</text>
  <text x="252" y="314" text-anchor="end" font-size="18" fill="#546e7a">170 ms</text>
  <text x="610" y="356" font-size="18" fill="#546e7a">204 ms</text>
  <text x="252" y="398" text-anchor="end" font-size="18" fill="#546e7a">238 ms</text>
  <text x="610" y="440" font-size="18" fill="#546e7a">272 ms</text>
  <line x1="265" y1="112" x2="594" y2="150" stroke="#1e88e5" stroke-width="3" marker-end="url(#tcpArrow)"/>
  <text x="14" y="100" font-size="19" fill="#0d47a1">ขอเปิดวงจร TCP</text>
  <text x="14" y="124" font-size="19" fill="#0d47a1">SYN</text>
  <line x1="597" y1="154" x2="268" y2="192" stroke="#1e88e5" stroke-width="3" marker-end="url(#tcpArrow)"/>
  <text x="670" y="144" font-size="19" fill="#0d47a1">รับทราบ</text>
  <text x="670" y="168" font-size="19" fill="#0d47a1">SYN-ACK</text>
  <line x1="265" y1="196" x2="594" y2="234" stroke="#43a047" stroke-width="3" marker-end="url(#tlsArrow)"/>
  <text x="14" y="184" font-size="19" fill="#1b5e20">ClientHello</text>
  <text x="14" y="208" font-size="19" fill="#2e7d32">+ ชื่อโฮสต์ (SNI)</text>
  <line x1="597" y1="238" x2="268" y2="276" stroke="#43a047" stroke-width="3" marker-end="url(#tlsArrow)"/>
  <text x="670" y="210" font-size="19" fill="#1b5e20">ServerHello</text>
  <text x="670" y="232" font-size="19" fill="#1b5e20">Certificate</text>
  <text x="670" y="254" font-size="19" fill="#1b5e20">ServerHelloDone</text>
  <line x1="265" y1="280" x2="594" y2="318" stroke="#43a047" stroke-width="3" marker-end="url(#tlsArrow)"/>
  <text x="14" y="266" font-size="19" fill="#1b5e20">ClientKeyExchange</text>
  <text x="14" y="288" font-size="19" fill="#1b5e20">ChangeCipherSpec</text>
  <text x="14" y="310" font-size="19" fill="#1b5e20">Finished</text>
  <line x1="597" y1="322" x2="268" y2="360" stroke="#43a047" stroke-width="3" marker-end="url(#tlsArrow)"/>
  <text x="670" y="294" font-size="19" fill="#1b5e20">ChangeCipherSpec</text>
  <text x="670" y="316" font-size="19" fill="#1b5e20">Finished</text>
  <line x1="265" y1="364" x2="594" y2="402" stroke="#212121" stroke-width="3" marker-end="url(#appArrow)"/>
  <text x="14" y="350" font-size="19" font-weight="700" fill="#212121">ข้อมูลจริงเริ่มเดิน</text>
  <text x="14" y="374" font-size="19" fill="#424242">MQTT CONNECT</text>
  <line x1="597" y1="406" x2="268" y2="444" stroke="#212121" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#appArrow)"/>
  <text x="670" y="382" font-size="19" fill="#424242">CONNACK</text>
  <path d="M846,110 L862,110 L862,190 L846,190" fill="none" stroke="#1e88e5" stroke-width="3"/>
  <text x="880" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#0d47a1" transform="rotate(90 880 150)">TCP 68 ms</text>
  <path d="M846,194 L862,194 L862,358 L846,358" fill="none" stroke="#43a047" stroke-width="3"/>
  <text x="880" y="276" text-anchor="middle" font-size="19" font-weight="700" fill="#1b5e20" transform="rotate(90 880 276)">TLS 136 ms</text>
  <text x="14" y="474" font-size="17" fill="#78909c">ดัดแปลงจาก: Full TLS 1.2 Handshake — Wikimedia Commons (สาธารณสมบัติ) · แปลไทยและปรับป้ายเอง</text>
  <text x="14" y="494" font-size="17" fill="#78909c">สมมติเวลาเดินทางเที่ยวเดียว 34 ms ตามภาพต้นฉบับ — เครือข่ายจริงตัวเลขเปลี่ยน แต่จำนวนรอบไป-กลับไม่เปลี่ยน</text>
</svg>
